<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>任职</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:#e8e4dc;
  font-family:"Songti SC","SimSun","Noto Serif CJK SC",serif;
  color:#1a1a1a;display:flex;align-items:center;justify-content:center;
  user-select:none;
}
#app{--card-width:min(78vw,300px,calc(100% - 32px));--card-height:clamp(300px,55vh,380px);
  width:100%;max-width:420px;height:100vh;height:100dvh;max-height:820px;
  display:flex;flex-direction:column;
  padding:max(16px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));
  position:relative}

/* 四条资源槽 */
#bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;
  flex:none;margin-bottom:14px;padding:2px 4px 0}
.bar{display:grid;grid-template-rows:14px 28px 14px 5px;row-gap:5px;
  min-width:0;text-align:center;place-items:center;position:relative}
.bar .impact{width:16px;height:14px;display:grid;place-items:center}
.bar .track{width:100%;max-width:64px;height:5px;background:#c9c3b6;
  border:1px solid #1a1a1a;position:relative;overflow:hidden;border-radius:1px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:#1a1a1a;
  transition:width .82s cubic-bezier(.18,.82,.22,1)}
.bar .icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#1a1a1a}
.bar .icon svg{width:26px;height:26px;display:block}
.bar .lbl{font-size:11px;line-height:14px;letter-spacing:0;color:#6b6459;white-space:nowrap}
.bar.warn .fill{background:#a8321e}
/* 结果反馈落在资源槽本身：减益红闪、增益浅绿闪，随后回到常态。 */
.bar.impact-down .icon,.bar.impact-down .lbl{color:#a8321e}
.bar.impact-down .track{border-color:#a8321e;box-shadow:0 0 0 2px rgba(168,50,30,.12)}
.bar.impact-down .fill{background:#a8321e}
.bar.impact-up .icon,.bar.impact-up .lbl{color:#687b3d}
.bar.impact-up .track{border-color:#687b3d;box-shadow:0 0 0 2px rgba(104,123,61,.12)}
.bar.impact-up .fill{background:#687b3d}
.bar.flash{animation:resourceHit .78s ease-out}
@keyframes resourceHit{
  0%,100%{transform:translateY(0);filter:none}
  18%{transform:translateY(-2px);filter:brightness(1.2)}
  42%{transform:translateY(1px);filter:brightness(.78)}
  68%{transform:translateY(-1px);filter:brightness(1.08)}
}

/* 影响提示独占一行，避免和图标、名称、状态条互相挤压 */
.bar .dot{display:block;border-radius:50%;background:#b59034;opacity:0;transform:scale(.45);
  transition:opacity .18s ease,transform .22s cubic-bezier(.2,.8,.2,1),width .18s,height .18s;
  box-shadow:0 0 0 3px rgba(181,144,52,.13);pointer-events:none}
.bar .dot.show{opacity:1;transform:scale(1);animation:impactPulse 1s ease-in-out infinite alternate}
@keyframes impactPulse{to{box-shadow:0 0 0 5px rgba(181,144,52,.06)}}

#meta{display:flex;justify-content:space-between;font-size:12px;
  color:#6b6459;letter-spacing:0;margin-bottom:12px;flex:none}

#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;
  perspective:900px;isolation:isolate;overflow:visible}

/* The back of the deck stays purely decorative. Keeping it separate from the
   active card lets the story engine choose the next card only after a decision. */
.deck{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:0;overflow:visible}
.deck-card{position:absolute;width:var(--card-width);height:var(--card-height);max-height:calc(100% - 8px);
  border:1.5px solid #171914;border-radius:9px;background:#27291f;
  box-shadow:4px 5px 0 rgba(26,26,26,.14);overflow:hidden;will-change:transform}
.deck-card::before{content:"";position:absolute;inset:12px;border:1px solid rgba(208,190,133,.35);
  background-image:linear-gradient(45deg,transparent 46%,rgba(208,190,133,.18) 47%,rgba(208,190,133,.18) 53%,transparent 54%),
    linear-gradient(-45deg,transparent 46%,rgba(208,190,133,.18) 47%,rgba(208,190,133,.18) 53%,transparent 54%);
  background-size:26px 26px;opacity:.82}
.deck-card.back-far{z-index:0;opacity:.56;transform:translate3d(0,-18px,0) scale(.93) rotate(-2.4deg);
  transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .35s ease}
.deck-card.back-mid{z-index:1;opacity:.78;transform:translate3d(0,-12px,0) scale(.965) rotate(1.5deg);
  transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .3s ease}
.deck-card.back-near{z-index:2;opacity:.94;transform:translate3d(0,-6px,0) scale(.985) rotate(-.8deg);
  transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .28s ease}
#stage.is-committing .back-far{opacity:.7}
#stage.is-committing .back-mid{opacity:.9}
#stage.is-committing .back-near{opacity:1}

.card{
  position:absolute;width:var(--card-width);height:var(--card-height);max-height:calc(100% - 8px);
  background:#faf7f0;border:1.5px solid #1a1a1a;border-radius:9px;
  box-shadow:5px 6px 0 rgba(26,26,26,.16);
  padding:20px 18px 16px;display:flex;flex-direction:column;
  cursor:grab;touch-action:none;z-index:3;will-change:transform,opacity;transform-origin:50% 86%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:visible;
}
.card.dragging{cursor:grabbing}
.card.touch-dragging .opt-label{transition-duration:.08s,.12s}
.card.waiting{cursor:default}
.card:focus-visible{outline:2px solid #1a1a1a;outline-offset:4px}
.card.anim{transition:transform .38s cubic-bezier(.22,1.25,.36,1),opacity .32s ease-out}
.card.deal-in{animation:cardDealIn .46s cubic-bezier(.2,.8,.2,1) both}
@keyframes cardDealIn{
  0%{opacity:0;transform:translate3d(0,26px,0) scale(.95) rotate(-1.2deg)}
  65%{opacity:1;transform:translate3d(0,-3px,0) scale(1.008) rotate(.15deg)}
  100%{opacity:1;transform:translate3d(0,0,0) scale(1) rotate(0)}
}
.card .who{font-size:12px;letter-spacing:0;color:#6b6459;
  border-bottom:1px solid #d5cfc2;padding-bottom:8px;margin-bottom:auto;min-height:14px;
  transition:opacity .18s}
.card .q{font-size:18px;line-height:1.72;padding:22px 2px;letter-spacing:0;
  transition:opacity .18s}
.card .hint{font-size:11px;color:#9a9284;letter-spacing:0;text-align:center;
  margin-top:auto;padding-top:10px;transition:opacity .18s}

.opt-label{position:absolute;top:18px;display:flex;align-items:center;min-height:38px;
  max-width:calc(100% - 36px);font-size:13px;line-height:1.4;letter-spacing:0;
  opacity:0;transform:translateY(-7px) scale(.96);transition:opacity .2s ease,transform .28s cubic-bezier(.2,.8,.2,1);
  padding:9px 13px;background:#171914;color:#f5efdf;border:1px solid rgba(208,190,133,.62);
  border-radius:3px;pointer-events:none;white-space:normal;overflow-wrap:anywhere;word-break:break-word;
  box-shadow:0 8px 18px rgba(26,26,26,.22);z-index:4}
.opt-label.revealed{opacity:1;transform:translateY(0) scale(1)}
.opt-yes{left:18px;text-align:left;border-left:3px solid #a9bd79}
.opt-no{right:18px;text-align:right;border-right:3px solid #c17d68}

/* 选择结果只保留一句黑字说明；资源变化由上方四条槽反馈。 */
#answer{position:absolute;left:50%;top:0;transform:translate(-50%,8px);
  width:min(92%,300px);max-width:300px;background:transparent;color:#1a1a1a;
  border:0;padding:7px 4px 0;font-size:13px;line-height:1.65;text-align:center;
  opacity:0;transition:opacity .22s;overflow-wrap:anywhere;white-space:pre-line;
  pointer-events:none;z-index:5}
#answer.on{opacity:1}
#answer.on{animation:answerRise .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes answerRise{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* 结局 / 继任 */
#veil{position:absolute;inset:0;background:#e8e4dc;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:34px;z-index:20}
#veil.on{display:flex}
#veil .kicker{font-size:11px;letter-spacing:0;color:#6b6459;margin-bottom:18px}
#veil h1{font-size:30px;margin:0 0 22px;letter-spacing:0;font-weight:normal}
#veil .body{font-size:14px;line-height:2;color:#3a3630;max-width:290px;margin-bottom:14px}
#veil .carry{font-size:12px;line-height:2;color:#6b6459;border-top:1px solid #d5cfc2;
  padding-top:16px;margin-top:6px;max-width:290px;text-align:left;width:100%}
#veil button{margin-top:26px;background:none;border:1.5px solid #1a1a1a;
  color:#1a1a1a;font-family:inherit;font-size:14px;letter-spacing:0;
  padding:11px 30px;cursor:pointer}
#veil button:active{background:#1a1a1a;color:#faf7f0}
#dbg{display:none}


@media (max-height:620px){
  #app{padding-top:12px;padding-bottom:10px}
  #bars{gap:12px;margin-bottom:8px;padding-top:0}
  .bar{grid-template-rows:14px 24px 13px 4px;row-gap:4px}
  .bar .impact{height:14px}
  .bar .icon,.bar .icon svg{width:22px;height:22px}
  .bar .lbl{font-size:10px;line-height:13px}
  .bar .track{height:4px}
  #meta{font-size:11px;margin-bottom:6px}
  .card{padding:17px 16px 14px}
  .card .q{font-size:17px;line-height:1.65;padding:16px 2px}
  .card .hint{padding-top:7px}
  .opt-label{top:14px;max-width:calc(100% - 28px);padding:8px 10px;font-size:12px;min-height:34px}
  #answer{width:92%;padding:6px 4px 0;font-size:12px;line-height:1.5}
  .deck-card.back-far{transform:translate3d(0,-14px,0) scale(.93) rotate(-2.4deg)}
  .deck-card.back-mid{transform:translate3d(0,-9px,0) scale(.965) rotate(1.5deg)}
  .deck-card.back-near{transform:translate3d(0,-5px,0) scale(.985) rotate(-.8deg)}
}

/* 触摸屏上把选择徽标做得更醒目，但仍留在当前卡片的面内。 */
@media (pointer:coarse), (max-width:600px){
  .opt-label{top:16px;min-height:44px;max-width:calc(100% - 28px);
    padding:10px 14px;font-size:15px;line-height:1.35;color:#fff;
    background:rgba(23,25,20,.97);border:1.5px solid rgba(208,190,133,.9);
    box-shadow:0 8px 20px rgba(26,26,26,.3)}
  .opt-yes{left:14px;border-left-width:3px}
  .opt-no{right:14px;border-right-width:3px}
}

@media (max-width:340px){
  #app{padding-left:12px;padding-right:12px}
  #bars{gap:10px;padding-left:2px;padding-right:2px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}

/* 周期切换横幅 —— 风来了和风停了必须能感觉到 */
#phaseBanner{position:absolute;left:50%;top:32%;transform:translate(-50%,-6px);
  display:flex;flex-direction:column;align-items:center;gap:7px;
  padding:17px 32px;border:1.5px solid #1a1a1a;background:#faf7f0;
  opacity:0;pointer-events:none;z-index:15;
  transition:opacity .34s,transform .34s;
  box-shadow:5px 6px 0 rgba(26,26,26,.16)}
#phaseBanner.on{opacity:1;transform:translate(-50%,0)}
#phaseBanner .pn{font-size:26px;letter-spacing:8px;line-height:1;text-indent:8px}
#phaseBanner .pt{font-size:12px;letter-spacing:2px;color:#6b6459}
#phaseBanner.phase-2{background:#f7ecd0;border-color:#a8801e}
#phaseBanner.phase-2 .pn{color:#8a6410}
#phaseBanner.phase-4{background:#e3e6ea;border-color:#4a5560}
#phaseBanner.phase-4 .pn{color:#33404d}
</style>
</head>

    flags:Object.assign({}, keep||{}),   // _keep 跨局保留
    lock:{},                            // card -> 解锁回合
    seen:{},
    win:rollWindow(),                   // 本局的风口窗口
    phase:1,
    lastPhase:1,
  };
}

/* ---------- 条件 ---------- */
function val(name){
  if (name==='money'||name==='cash')   return S.money;
  if (name==='team')                   return S.team;
  if (name==='market')                 return S.market;
  if (name==='mind')                   return S.mind;
  if (name==='dynasty')                return S.dynasty;
  if (name==='turn')                   return S.turn;
  if (name==='year')                   return S.year;
  if (name==='phase')                  return S.phase;
  if (name==='overall')                return Math.round((S.money+S.team+S.market+S.mind)/4);
  if (/^nb_/.test(name))               return S.flags[name]|0;
  return S.flags[name] ? 1 : 0;
}

function testOne(t){
  t = t.trim();
  if (!t) return true;
  let m = t.match(/^([a-zA-Z_][\w]*)\s*(>=|<=|>|<|=)\s*(-?\d+)$/);
  if (m){
    const a = val(m[1]), b = parseInt(m[3],10);
    switch(m[2]){
      case '>':  return a >  b;
      case '<':  return a <  b;
      case '=':  return a === b;
      case '>=': return a >= b;
      case '<=': return a <= b;
    }
  }
  if (t[0]==='!') return !val(t.slice(1));
  return !!val(t);
}

function testCond(str){
  if (!str || !str.trim()) return true;
  return str.split(/\s+and\s+/).every(testOne);
}

/* ---------- 抽卡 ---------- */
function pick(){
  if (forced){
    const f = forced; forced = null;
    return f;
  }
  const pool = [];
  let best = 0;
  for (let i=0;i<CARDS.length;i++){
    const c = CARDS[i];
    if (!c.weight) continue;                       // 续写卡：永不随机抽中
    if (S.lock[c.card] && S.turn < S.lock[c.card]) continue;
    if (!testCond(c.conditions)) continue;
    const w = c.weight === 'max' ? 1e9 : parseInt(c.weight,10);
    if (!w || isNaN(w)) continue;
    if (w > best) best = w;
    pool.push([i,w]);
  }
  if (!pool.length) return -1;
  // 高权重压倒：只在最高一档里随机（死亡卡就是靠这个必出的）
  const top = pool.filter(p => p[1] >= best*0.5);
  const use = best >= 1000 ? pool.filter(p=>p[1]===best) : top;
  let sum = 0; use.forEach(p=>sum+=p[1]);
  let r = Math.random()*sum;
  for (const p of use){ r -= p[1]; if (r<=0) return p[0]; }
  return use[use.length-1][0];
}

/* ---------- 应用结果 ---------- */
function applyFlags(str, idx){
  if (!str) return;
  str.split(/\s+and\s+/).forEach(tok=>{
    let t = tok.trim();
    if (!t) return;
    if (t[0]==='>'){                                  // 跳转
      const arrows = t.match(/^>+/)[0].length;
      const rest = t.slice(arrows);
      if (rest && rest[0]==='_'){
        const tgt = byName[rest.slice(1)];
        if (tgt!==undefined) forced = tgt;
      } else if (rest && byName[rest]!==undefined){
        forced = byName[rest];
      } else if (rest && /^\d+$/.test(rest)){
        forced = idx + parseInt(rest,10);
      } else {
        forced = idx + arrows;
      }
      return;
    }
    if (t.slice(-1)==='+'){                            // 计数器
      const base = t.replace(/\++$/,'');
      S.flags[base] = (S.flags[base]|0) + (t.length - base.length);
      return;
    }
    if (t[0]==='!'){ delete S.flags[t.slice(1)]; return; }
    if (/^(del|add)_/.test(t)){ S.flags[t] = 1; return; }
    if (/^mus_/.test(t)) return;                       // 音乐指令，原型里忽略
    S.flags[t] = 1;
  });
}

function num(v){
  if (!v) return 0;
  v = String(v).replace(/[?*]/g,'').trim();
  if (!v) return 0;
  const m = v.match(/^-?\d+/);
  return m ? parseInt(m[0],10) : 0;
}

function feedbackMarkup(reply){
  // 结果区只承担一句解释；具体的得失由上方资源槽的动画表达。
  return String(reply || '');
}

/* ---------- 渲染 ---------- */
const $ = s => document.querySelector(s);
const stage = $('#stage'), veil = $('#veil'), ansEl = $('#answer');


function drawBars(previousValues){
  const box = $('#bars');
  if (!box.children.length){
    box.innerHTML = RES.map(r=>
      `<div class="bar" data-k="${r.k}" aria-label="${r.n}">
         <div class="impact"><span class="dot"></span></div>
         <div class="icon">${r.icon}</div>
         <div class="lbl">${r.n}</div>
         <div class="track" role="progressbar" aria-label="${r.n}" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div>
       </div>`).join('');
  }
  RES.forEach(r=>{
    const el = box.querySelector(`[data-k="${r.k}"]`);
    const v = Math.max(0, Math.min(100, S[r.k]));
    const fill = el.querySelector('.fill');
    const track = el.querySelector('.track');
    const before = previousValues && Number.isFinite(previousValues[r.k])
      ? Math.max(0, Math.min(100, previousValues[r.k])) : null;
    const changed = before !== null && before !== v;
    if (changed){
      const direction = v < before ? 'impact-down' : 'impact-up';
      el.classList.remove('impact-down','impact-up','flash');
      void el.offsetWidth;
      el.classList.add(direction,'flash');
      // 先停在旧位置，再在下一帧明显退进，避免瞬间跳变。
      fill.style.transition = 'none';
      fill.style.width = before + '%';
      void fill.offsetWidth;
      fill.style.transition = '';
      requestAnimationFrame(()=>{
        if (fill.isConnected) fill.style.width = v + '%';
      });
      window.setTimeout(()=>{
        if (el.isConnected) el.classList.remove('impact-down','impact-up','flash');
      }, 980);
    } else {
      fill.style.width = v + '%';
      if (!previousValues) el.classList.remove('impact-down','impact-up','flash');
    }
    track.setAttribute('aria-valuenow', v);
    el.classList.toggle('warn', v<=20 || v>=80);
  });
  $('#mLeft').textContent  = `第 ${S.dynasty} 任`;
  const remaining = Math.max(0, BOARD_REVIEW_TURN - S.turn);
  $('#mRight').textContent = remaining > 0 ? `还剩 ${remaining} 次` : '本任结束';
}

const DECK_LAYERS = [
  {className:'back-far', y:-18, compactY:-14, scale:.93, angle:-2.4, settle:6},
  {className:'back-mid', y:-12, compactY:-9,  scale:.965, angle:1.5, settle:7},
  {className:'back-near',y:-6,  compactY:-5,  scale:.985, angle:-.8, settle:6},
];

function ensureDeck(){
  let deck = stage.querySelector('.deck');
  if (deck) return deck;
  deck = document.createElement('div');
  deck.className = 'deck';
  deck.setAttribute('aria-hidden','true');
  deck.innerHTML = DECK_LAYERS.map(layer =>
    `<div class="deck-card ${layer.className}"></div>`
  ).join('');
  stage.prepend(deck);
  setDeckProgress(0);
  return deck;
}

function setDeckProgress(progress){
  const deck = stage.querySelector('.deck');
  if (!deck) return;
  const p = Math.max(0, Math.min(1, progress));
  const compact = window.innerHeight <= 620;
  DECK_LAYERS.forEach(layer=>{
    const el = deck.querySelector('.' + layer.className);
    if (!el) return;
    const startY = compact ? layer.compactY : layer.y;
    const y = startY + p * Math.min(Math.abs(startY), layer.settle);
    const scale = layer.scale + p * (1 - layer.scale) * .45;
    const angle = layer.angle * (1 - p * .18);
    el.style.transform = `translate3d(0,${y}px,0) scale(${scale}) rotate(${angle}deg)`;
  });
}

function positionAnswer(){
  const activeCard = stage.querySelector('.card');
  if (!activeCard) return;
  const compact = window.innerHeight <= 620;
  const gap = compact ? 18 : 24;
  const cardTop = activeCard.offsetTop;
  const cardBottom = cardTop + activeCard.offsetHeight;
  const answerHeight = ansEl.offsetHeight;
  const below = cardBottom + gap;
  const above = cardTop - gap - answerHeight;
  const top = below + answerHeight <= stage.clientHeight ? below : Math.max(0,above);
  ansEl.style.top = `${top}px`;
}

function show(idx, unlockDelay=0){
  curIdx = idx;
  cur = CARDS[idx];

  ansEl.classList.remove('on');
  ansEl.innerHTML = '';

  // 构建 yes 和 no 对象，包含资源变化
  cur.yes = {
    cash: parseInt(cur.yes_cash) || 0,
    team: parseInt(cur.yes_team) || 0,
    market: parseInt(cur.yes_market) || 0,
    capital: parseInt(cur.yes_capital) || 0
  };
  cur.no = {
    cash: parseInt(cur.no_cash) || 0,
    team: parseInt(cur.no_team) || 0,
    market: parseInt(cur.no_market) || 0,
    capital: parseInt(cur.no_capital) || 0
  };

  ensureDeck();
  const el = document.createElement('div');
  el.className = 'card deal-in';
  el.innerHTML = `<div class="opt-label opt-no" aria-hidden="true"></div>
    <div class="opt-label opt-yes" aria-hidden="true"></div>
    <div class="who">${cur.bearer||''}</div>
    <div class="q">${(cur.question||'').replace(/\n/g,'<br>')}</div>
    <div class="hint">← 左划 · 右划 →</div>`;
  const clearDealIn = ()=>el.classList.remove('deal-in');
  el.addEventListener('animationend',clearDealIn,{once:true});
  stage.querySelectorAll('.card').forEach(n=>n.remove());
  stage.appendChild(el);
  stage.classList.remove('is-committing','is-dragging');
  setDeckProgress(0);
  setTimeout(clearDealIn,520);
  el.querySelector('.opt-no').textContent = cur.override_no  || '否';
  el.querySelector('.opt-yes').textContent = cur.override_yes || '是';
  el.tabIndex = 0;
  el.setAttribute('role', 'group');
  el.setAttribute('aria-keyshortcuts', 'ArrowLeft ArrowRight');
  el.setAttribute('aria-label', `${cur.bearer||'决策'}：${cur.question||''}。左选项：${cur.override_no||'否'}；右选项：${cur.override_yes||'是'}`);
  bindDrag(el);
  const unlock = ()=>{
    if (!el.isConnected) return;
    busy = false;
    el.classList.remove('waiting');
    el.removeAttribute('aria-disabled');
    if (restoreCardFocus) el.focus();
  };
  if (unlockDelay > 0){
    busy = true;
    el.classList.add('waiting');
    el.setAttribute('aria-disabled','true');
    setTimeout(unlock,unlockDelay);
  } else {
    unlock();
  }
  drawBars();
  dbg();
}

function dbg(){
  const ks = Object.keys(S.flags).filter(k=>S.flags[k]).slice(-6);
  $('#dbg').textContent = `${cur? cur.thematic+'/'+(cur.card||cur.id) : ''}\n${ks.join(' ')}`;
}

/* ---------- 交互 ---------- */
function hideImpactDots(){
  RES.forEach(r=>{
    const dot = $('#bars').querySelector(`[data-k="${r.k}"] .dot`);
    if (dot) dot.classList.remove('show');
  });
}

function showImpactDots(choice){
  RES.forEach(r=>{
    const dot = $('#bars').querySelector(`[data-k="${r.k}"] .dot`);
    if (!dot) return;
    const delta = Math.abs(choice[r.k] || 0);
    if (!delta){
      dot.classList.remove('show');
      return;
    }
    const size = delta >= 20 ? 12 : delta >= 15 ? 10 : delta >= 10 ? 8 : 6;
    dot.style.width = size + 'px';
    dot.style.height = size + 'px';
    dot.classList.add('show');
  });
}

function bindDrag(el){
  let sx=0, dx=0, drag=false, pointerId=null, pointerType='', inputSource='';
  const choiceNo = el.querySelector('.opt-no');
  const choiceYes = el.querySelector('.opt-yes');
  const who = el.querySelector('.who');
  const question = el.querySelector('.q');
  const hint = el.querySelector('.hint');

  const isTouchEvent = e => e.type.indexOf('touch') === 0;
  const pointFrom = e => {
    const point = isTouchEvent(e)
      ? ((e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]))
      : e;
    return point && Number.isFinite(point.clientX) ? point : null;
  };
  const clientX = e => {
    const point = pointFrom(e);
    return point ? point.clientX : null;
  };

  const reset = ()=>{
    el.style.transform='';
    choiceNo.style.opacity = choiceYes.style.opacity = '0';
    choiceNo.classList.remove('revealed');
    choiceYes.classList.remove('revealed');
    who.style.opacity = question.style.opacity = hint.style.opacity = '1';
    stage.classList.remove('is-dragging','is-committing');
    el.classList.remove('touch-dragging');
    setDeckProgress(0);
    hideImpactDots();
  };

  const down = e => {
    const touch = isTouchEvent(e) || e.pointerType === 'touch' || e.pointerType === 'pen';
    // Touch pointer events commonly use button=-1; only reject non-primary mice.
    if (busy || drag || (!touch && e.button !== 0)) return;
    const x = clientX(e);
    if (x === null) return;
    restoreCardFocus = false;
    // 区分事件来源（pointer/touch）与指针类型（mouse/touch/pen）。
    // 有些浏览器会同时派发两套事件，来源锁定可避免重复提交。
    drag=true; inputSource=isTouchEvent(e) ? 'touch' : 'pointer';
    pointerId=e.pointerId == null ? null : e.pointerId;
    pointerType=touch ? 'touch' : (e.pointerType || 'mouse');
    sx=x; dx=0;
    el.classList.remove('anim','deal-in');
    el.classList.add('dragging');
    if (touch) el.classList.add('touch-dragging');
    stage.classList.add('is-dragging');
    if (e.pointerId != null && el.setPointerCapture){
      try { el.setPointerCapture(e.pointerId); } catch (_) { /* older WebKit */ }
    }
    if (touch && e.cancelable) e.preventDefault();
  };
  const move = e => {
    if(!drag) return;
    const eventSource = isTouchEvent(e) ? 'touch' : 'pointer';
    // 触摸指针在部分 WebView 中会交替派发 pointermove/touchmove，两者都可用。
    if (pointerType !== 'touch' && eventSource !== inputSource) return;
    if (!isTouchEvent(e) && pointerId !== null && e.pointerId !== pointerId) return;
    const x = clientX(e);
    if (x === null) return;
    dx=x - sx;
    if (isTouchEvent(e) && e.cancelable) e.preventDefault();
    const visualDx = Math.max(-112, Math.min(112, dx));
    el.style.transform=`translateX(${visualDx}px) rotate(${visualDx/26}deg)`;
    setDeckProgress(Math.min(1, Math.abs(dx) / 120));
    // 中立区先保留回弹空间；只有明显偏向一侧时才让选项变得醒目。
    const absD = Math.abs(dx);
    const revealStart = pointerType === 'touch' ? 24 : 30;
    const revealFull = pointerType === 'touch' ? 86 : 96;
    const optOpacity = absD>revealStart
      ? Math.min(1,(absD-revealStart)/(revealFull-revealStart))
      : 0;
    const visibleOpacity = pointerType === 'touch' && absD > 48
      ? Math.max(.88,optOpacity) : optOpacity;
    // 卡片内容渐隐，但不影响上方的选择徽标。
    const contentStart = pointerType === 'touch' ? 24 : 30;
    const contentFull = pointerType === 'touch' ? 76 : 80;
    const contentOpacity = absD>contentStart
      ? Math.max(0, 1-(absD-contentStart)/(contentFull-contentStart))
      : 1;

    choiceYes.style.opacity = dx>revealStart ? visibleOpacity : 0;
    choiceNo.style.opacity = dx<-revealStart ? visibleOpacity : 0;
    choiceYes.classList.toggle('revealed',dx>revealStart);
    choiceNo.classList.toggle('revealed',dx<-revealStart);
    who.style.opacity = question.style.opacity = hint.style.opacity = contentOpacity;

    // 显示影响圆点
    if (absD > revealStart) {
      showImpactDots(dx > 0 ? cur.yes : cur.no);
    } else {
      hideImpactDots();
    }
  };
  const commit = yes=>{
    const fly = window.innerWidth + el.offsetWidth;
    const direction = yes ? 1 : -1;
    el.style.transform=`translate3d(${direction*fly}px,-${Math.min(76,Math.max(34,Math.abs(dx)*.22))}px,0) rotate(${direction*22}deg) scale(.96)`;
    el.style.opacity='0';
    choiceNo.style.opacity = choiceYes.style.opacity = '0';
    choiceNo.classList.remove('revealed');
    choiceYes.classList.remove('revealed');
    stage.classList.remove('is-dragging');
    el.classList.remove('touch-dragging');
    stage.classList.add('is-committing');
    setDeckProgress(1);
    hideImpactDots();
    choose(yes);
  };

  const finish = (e, cancelled=false) => {
    if(!drag) return;
    drag=false;
    inputSource='';
    el.classList.remove('dragging');
    el.classList.add('anim');
    stage.classList.remove('is-dragging');
    // 提交阈值约为卡片宽度的一半。阈值以内始终回到中立位。
    const commitThreshold = Math.max(136, Math.min(164, el.offsetWidth * .48));
    if (!cancelled && Math.abs(dx) >= commitThreshold){
      commit(dx>0);
    } else {
      reset();
    }
    dx=0;
  };
  el.addEventListener('pointerdown',down);
  el.addEventListener('pointermove',move);
  el.addEventListener('pointerup',e=>finish(e,false));
  el.addEventListener('pointercancel',e=>finish(e,true));
  // Older iOS/WebView builds may expose touch events without reliable PointerEvents.
  el.addEventListener('touchstart',down,{passive:false});
  el.addEventListener('touchmove',move,{passive:false});
  el.addEventListener('touchend',e=>finish(e,false),{passive:false});
  el.addEventListener('touchcancel',e=>finish(e,true),{passive:false});
  el.addEventListener('keydown',e=>{
    if (busy || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
    e.preventDefault();
    restoreCardFocus = true;
    el.classList.add('anim');
    commit(e.key === 'ArrowRight');
  });
}

function choose(yes){
  if (busy) return;
  busy = true;
  const p = yes ? 'yes' : 'no';
  const previousValues = {money:S.money, team:S.team, market:S.market, mind:S.mind};
  const ph = PHASES[S.phase] || PHASES[1];
  RES.forEach(r=>{
    let d = num(cur[p+'_'+r.k]);
    if (!d) return;
    // 心气不受周期影响 —— 你的偏执跟大盘没关系
    if (r.k !== 'mind') d = d > 0 ? Math.round(d*ph.gain) : Math.round(d*ph.loss);
    if (d) S[r.k] = Math.max(0, Math.min(100, S[r.k]+d));
  });
  if (cur.lockturn === 'del')      S.lock[cur.card] = 1e9;
  else if (cur.lockturn)           S.lock[cur.card] = S.turn + parseInt(cur.lockturn,10);
  S.seen[cur.card] = 1;
  applyFlags(cur[p+'_custom'], curIdx);

  const ending = cur.thematic === 'endings' ? endingOf(cur[p+'_custom']) : null;
  const reply  = cur['answer_'+p];
  const feedbackDuration = 1280;

  drawBars(previousValues);
  ansEl.textContent = feedbackMarkup(reply);
  if (reply){
    positionAnswer();
    ansEl.classList.add('on');
  } else {
    ansEl.classList.remove('on');
  }
  setTimeout(()=>{
    if (ending){
      ansEl.classList.remove('on');
      step(ending);
      return;
    }
    ansEl.classList.remove('on');
    step(null);
  },feedbackDuration);
}

function endingOf(str){
  if (!str) return null;
  const m = str.match(/end_(.+?)(?:\s|$)/);
  if (m && ENDINGS[m[1]]) return m[1];
  for (const k in ENDINGS) if (str.indexOf(k)>=0) return k;
  return null;
}

function step(ending, unlockDelay=0){
  if (ending){ showEnding(ending); return; }
  S.turn++;
  S.lastPhase = S.phase;
  S.phase = phaseOf(S.turn, S.win);
  const idx = pick();
  if (idx < 0){ showEnding('没人要'); return; }
  show(idx,unlockDelay);
  // 周期切换要让玩家明确感觉到，否则风口白给
  if (S.phase !== S.lastPhase) announcePhase(S.phase);
}

// 周期切换横幅。风来了、风停了，是这局最重要的两个时刻。
function announcePhase(phase){
  const ph = PHASES[phase];
  if (!ph) return;
  let el = document.getElementById('phaseBanner');
  if (!el){
    el = document.createElement('div');
    el.id = 'phaseBanner';
    document.getElementById('app').appendChild(el);
  }
  el.className = 'phase-' + phase;
  el.innerHTML = `<span class="pn">${ph.name}</span><span class="pt">${ph.tip}</span>`;
  el.classList.remove('on');
  void el.offsetWidth;
  el.classList.add('on');
  window.setTimeout(()=>{ el.classList.remove('on'); }, 2100);
}

/* ---------- 结局与继任 ---------- */
let pendingEnd = null;

function showEnding(key){
  const e = ENDINGS[key];
  pendingEnd = key;
  const years = Math.floor(S.turn/6), months = S.turn%6*2;
  veil.innerHTML =
    `<div class="kicker">${e.kicker}</div>
     <h1>${key}</h1>
     <div class="body">${e.body.replace(/\n/g,'<br>')}</div>
     <div class="carry">在位 ${years} 年 ${months} 个月 · 第 ${S.dynasty} 任<br><br>${e.carry}</div>
     <button id="go">${e.win?'再来一次':'下一任'}</button>`;
  veil.classList.add('on');
  $('#go').onclick = succeed;
  if (restoreCardFocus) $('#go').focus();
}

function succeed(){
  const e = ENDINGS[pendingEnd];
  // 只保留 _keep 标记，_run 和其他一律清空
  const keep = {};
  for (const k in S.flags){
    if (S.flags[k] && /_keep$/.test(k)) keep[k] = S.flags[k];
    if (S.flags[k] && /^nb_/.test(k))   keep[k] = S.flags[k];   // 计数器也留
  }
  if (e.flag) keep[e.flag] = 1;
  const dyn = S.dynasty + 1;
  initState(e.next, dyn, keep);
  veil.classList.remove('on');
  step(null);
}

/* ---------- 启动 ---------- */
(function boot(){
  CARDS.forEach((c,i)=>{ if (c.card) byName[c.card] = i; });
  initState({money:45,team:55,market:38,mind:52}, 1, {});
  veil.innerHTML =
    `<div class="kicker">创业 · 卡牌</div>
     <h1>创 业</h1>
     <div class="body">三个人，一间三十平的房子，账上十七万。<br><br>
       四条槽 —— <b>钱</b>还剩几个月，<b>人</b>还剩几个，<br>
       <b>客</b>要不要，还有<b>心</b>：你还剩多少自己的偏执。<br><br>
       任意一条见底或者爆表，你就出局。<br>
       但风口会来，也会走，跟你做得好不好没关系。</div>

       风来的时候敢不敢押，是这局最重要的一次决定。</div>
     <button id="go">开始</button>`;
  veil.classList.add('on');
  $('#go').onclick = ()=>{ veil.classList.remove('on'); step(null); };
