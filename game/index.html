<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>任职</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:#e8e4dc;
  font-family:"Songti SC","SimSun","Noto Serif CJK SC",serif;
  color:#1a1a1a;display:flex;align-items:center;justify-content:center;
  user-select:none;
}
#app{width:100%;max-width:420px;height:100%;max-height:820px;
  display:flex;flex-direction:column;padding:20px 16px;position:relative}

/* 四条资源槽 */
#bars{display:flex;gap:14px;margin-bottom:20px;padding-top:14px}
.bar{flex:1;text-align:center;position:relative}
.bar .track{height:8px;background:#c9c3b6;border:1px solid #1a1a1a;position:relative;overflow:hidden;
  border-radius:2px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:#1a1a1a;
  transition:width .45s cubic-bezier(.2,.8,.2,1)}
.bar .lbl{font-size:12px;margin-top:6px;letter-spacing:1.2px;color:#6b6459}
.bar .num{font-size:11px;color:#8a7f70;font-variant-numeric:tabular-nums;margin-top:2px}
.bar.warn .fill{background:#a8321e}
.bar.flash{animation:fl .5s}
@keyframes fl{0%,100%{opacity:1}50%{opacity:.25}}

/* 影响提示圆点 - 在资源槽上方 */
.bar .dot{position:absolute;top:-10px;left:50%;transform:translateX(-50%);
  border-radius:50%;background:#d4af37;
  opacity:0;transition:opacity .2s,width .2s,height .2s;
  box-shadow:0 2px 5px rgba(0,0,0,.35);pointer-events:none}
.bar .dot.show{opacity:1}

#meta{display:flex;justify-content:space-between;font-size:12px;
  color:#6b6459;letter-spacing:1px;margin-bottom:16px}

#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center}

.card{
  position:absolute;width:100%;max-width:330px;min-height:400px;
  background:#faf7f0;border:1.5px solid #1a1a1a;
  box-shadow:5px 6px 0 rgba(26,26,26,.16);
  padding:22px 20px 18px;display:flex;flex-direction:column;
  cursor:grab;touch-action:none;
}
.card.anim{transition:transform .32s ease-out,opacity .32s ease-out}
.card .who{font-size:12px;letter-spacing:2px;color:#6b6459;
  border-bottom:1px solid #d5cfc2;padding-bottom:8px;margin-bottom:auto;min-height:14px;
  transition:opacity .18s}
.card .q{font-size:19px;line-height:1.75;padding:26px 2px;letter-spacing:.5px;
  transition:opacity .18s}
.card .hint{font-size:11px;color:#9a9284;letter-spacing:1px;text-align:center;
  margin-top:auto;padding-top:10px;transition:opacity .18s}

/* 卡片内选项标签 - 在卡片内上角 */
.opt-label{position:absolute;top:16px;
  font-size:15px;letter-spacing:1.5px;opacity:0;transition:opacity .18s;
  padding:8px 16px;background:rgba(26,26,26,.92);color:#faf7f0;
  border-radius:4px;pointer-events:none;white-space:nowrap;
  box-shadow:0 3px 8px rgba(0,0,0,.3)}
.opt-left{left:16px}
.opt-right{right:16px}

/* 回话气泡 */
#answer{position:absolute;left:50%;bottom:14%;transform:translateX(-50%);
  width:88%;max-width:320px;background:#1a1a1a;color:#faf7f0;
  padding:15px 18px;font-size:15px;line-height:1.7;opacity:0;
  transition:opacity .22s;pointer-events:none;z-index:5}
#answer.on{opacity:1}

/* 结局 / 继任 */
#veil{position:absolute;inset:0;background:#e8e4dc;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:34px;z-index:20}
#veil.on{display:flex}
#veil .kicker{font-size:11px;letter-spacing:4px;color:#6b6459;margin-bottom:18px}
#veil h1{font-size:30px;margin:0 0 22px;letter-spacing:5px;font-weight:normal}
#veil .body{font-size:14px;line-height:2;color:#3a3630;max-width:290px;margin-bottom:14px}
#veil .carry{font-size:12px;line-height:2;color:#6b6459;border-top:1px solid #d5cfc2;
  padding-top:16px;margin-top:6px;max-width:290px;text-align:left;width:100%}
#veil button{margin-top:26px;background:none;border:1.5px solid #1a1a1a;
  color:#1a1a1a;font-family:inherit;font-size:14px;letter-spacing:3px;
  padding:11px 30px;cursor:pointer}
#veil button:active{background:#1a1a1a;color:#faf7f0}
#dbg{position:absolute;left:0;bottom:0;font-size:9px;color:#b5ada0;
  pointer-events:none;white-space:pre;line-height:1.35}
</style>
</head>
<body>
<div id="app">
  <div id="bars"></div>
  <div id="meta"><span id="mLeft"></span><span id="mRight"></span></div>
  <div id="stage">
  </div>
  <div id="answer"></div>
  <div id="veil"></div>
  <div id="dbg"></div>
</div>
<script>
const CARDS = /*__CARDS__*/[];
</script>
<script src="engine.js"></script>
</body>
</html>
