<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:#e8e4dc;
  font-family:"Songti SC","SimSun","Noto Serif CJK SC",serif;
  color:#1a1a1a;display:flex;align-items:center;justify-content:center;
  user-select:none;
}
#app{--card-width:min(78vw,300px,calc(100% - 32px));--card-height:clamp(300px,55vh,380px);
  width:100%;max-width:420px;height:100vh;height:100dvh;max-height:820px;
  display:flex;flex-direction:column;
  padding:max(16px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));
  position:relative}

/* 四条资源槽 */
#bars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;
  flex:none;margin-bottom:14px;padding:2px 4px 0}
.bar{display:grid;grid-template-rows:14px 28px 14px 5px;row-gap:5px;
  min-width:0;text-align:center;place-items:center;position:relative}
.bar .impact{width:16px;height:14px;display:grid;place-items:center}
.bar .track{width:100%;max-width:64px;height:5px;background:#c9c3b6;
  border:1px solid #1a1a1a;position:relative;overflow:hidden;border-radius:1px}
.bar .fill{position:absolute;left:0;top:0;bottom:0;background:#1a1a1a;
  transition:width .82s cubic-bezier(.18,.82,.22,1)}
.bar .icon{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#1a1a1a}
.bar .icon svg{width:26px;height:26px;display:block}
.bar .lbl{font-size:11px;line-height:14px;letter-spacing:0;color:#6b6459;white-space:nowrap}
.bar.warn .fill{background:#a8321e}
/* 结果反馈落在资源槽本身：减益红闪、增益浅绿闪，随后回到常态。 */
.bar.impact-down .icon,.bar.impact-down .lbl{color:#a8321e}
.bar.impact-down .track{border-color:#a8321e;box-shadow:0 0 0 2px rgba(168,50,30,.12)}
.bar.impact-down .fill{background:#a8321e}
.bar.impact-up .icon,.bar.impact-up .lbl{color:#687b3d}
.bar.impact-up .track{border-color:#687b3d;box-shadow:0 0 0 2px rgba(104,123,61,.12)}
.bar.impact-up .fill{background:#687b3d}
.bar.flash{animation:resourceHit .78s ease-out}
@keyframes resourceHit{
  0%,100%{transform:translateY(0);filter:none}
  18%{transform:translateY(-2px);filter:brightness(1.2)}
  42%{transform:translateY(1px);filter:brightness(.78)}
  68%{transform:translateY(-1px);filter:brightness(1.08)}
}

/* 影响提示独占一行，避免和图标、名称、状态条互相挤压 */
.bar .dot{display:block;border-radius:50%;background:#b59034;opacity:0;transform:scale(.45);
  transition:opacity .18s ease,transform .22s cubic-bezier(.2,.8,.2,1),width .18s,height .18s;
  box-shadow:0 0 0 3px rgba(181,144,52,.13);pointer-events:none}
.bar .dot.show{opacity:1;transform:scale(1);animation:impactPulse 1s ease-in-out infinite alternate}
@keyframes impactPulse{to{box-shadow:0 0 0 5px rgba(181,144,52,.06)}}

#meta{display:flex;justify-content:space-between;font-size:12px;
  color:#6b6459;letter-spacing:0;margin-bottom:12px;flex:none}

#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;
  perspective:900px;isolation:isolate;overflow:visible}

/* The back of the deck stays purely decorative. Keeping it separate from the
   active card lets the story engine choose the next card only after a decision. */
.deck{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:0;overflow:visible}
.deck-card{position:absolute;width:var(--card-width);height:var(--card-height);max-height:calc(100% - 8px);
  border:1.5px solid #171914;border-radius:9px;background:#27291f;
  box-shadow:4px 5px 0 rgba(26,26,26,.14);overflow:hidden;will-change:transform}
.deck-card::before{content:"";position:absolute;inset:12px;border:1px solid rgba(208,190,133,.35);
  background-image:linear-gradient(45deg,transparent 46%,rgba(208,190,133,.18) 47%,rgba(208,190,133,.18) 53%,transparent 54%),
    linear-gradient(-45deg,transparent 46%,rgba(208,190,133,.18) 47%,rgba(208,190,133,.18) 53%,transparent 54%);
  background-size:26px 26px;opacity:.82}
.deck-card.back-far{z-index:0;opacity:.56;transform:translate3d(0,-18px,0) scale(.93) rotate(-2.4deg);
  transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .35s ease}
.deck-card.back-mid{z-index:1;opacity:.78;transform:translate3d(0,-12px,0) scale(.965) rotate(1.5deg);
  transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .3s ease}
.deck-card.back-near{z-index:2;opacity:.94;transform:translate3d(0,-6px,0) scale(.985) rotate(-.8deg);
  transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .28s ease}
#stage.is-committing .back-far{opacity:.7}
#stage.is-committing .back-mid{opacity:.9}
#stage.is-committing .back-near{opacity:1}

.card{
  position:absolute;width:var(--card-width);height:var(--card-height);max-height:calc(100% - 8px);
  background:#faf7f0;border:1.5px solid #1a1a1a;border-radius:9px;
  box-shadow:5px 6px 0 rgba(26,26,26,.16);
  padding:20px 18px 16px;display:flex;flex-direction:column;
  cursor:grab;touch-action:none;z-index:3;will-change:transform,opacity;transform-origin:50% 86%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overflow:visible;
}
.card.dragging{cursor:grabbing}
.card.touch-dragging .opt-label{transition-duration:.08s,.12s}
.card.waiting{cursor:default}
.card:focus-visible{outline:2px solid #1a1a1a;outline-offset:4px}
.card.anim{transition:transform .38s cubic-bezier(.22,1.25,.36,1),opacity .32s ease-out}
.card.deal-in{animation:cardDealIn .46s cubic-bezier(.2,.8,.2,1) both}
@keyframes cardDealIn{
  0%{opacity:0;transform:translate3d(0,26px,0) scale(.95) rotate(-1.2deg)}
  65%{opacity:1;transform:translate3d(0,-3px,0) scale(1.008) rotate(.15deg)}
  100%{opacity:1;transform:translate3d(0,0,0) scale(1) rotate(0)}
}
.card .who{font-size:12px;letter-spacing:0;color:#6b6459;
  border-bottom:1px solid #d5cfc2;padding-bottom:8px;margin-bottom:auto;min-height:14px;
  transition:opacity .18s}
.card .q{font-size:18px;line-height:1.72;padding:22px 2px;letter-spacing:0;
  transition:opacity .18s}
.card .hint{font-size:11px;color:#9a9284;letter-spacing:0;text-align:center;
  margin-top:auto;padding-top:10px;transition:opacity .18s}

.opt-label{position:absolute;top:18px;display:flex;align-items:center;min-height:38px;
  max-width:calc(100% - 36px);font-size:13px;line-height:1.4;letter-spacing:0;
  opacity:0;transform:translateY(-7px) scale(.96);transition:opacity .2s ease,transform .28s cubic-bezier(.2,.8,.2,1);
  padding:9px 13px;background:#171914;color:#f5efdf;border:1px solid rgba(208,190,133,.62);
  border-radius:3px;pointer-events:none;white-space:normal;overflow-wrap:anywhere;word-break:break-word;
  box-shadow:0 8px 18px rgba(26,26,26,.22);z-index:4}
.opt-label.revealed{opacity:1;transform:translateY(0) scale(1)}
.opt-yes{left:18px;text-align:left;border-left:3px solid #a9bd79}
.opt-no{right:18px;text-align:right;border-right:3px solid #c17d68}

/* 选择结果只保留一句黑字说明；资源变化由上方四条槽反馈。 */
#answer{position:absolute;left:50%;top:0;transform:translate(-50%,8px);
  width:min(92%,300px);max-width:300px;background:transparent;color:#1a1a1a;
  border:0;padding:7px 4px 0;font-size:13px;line-height:1.65;text-align:center;
  opacity:0;transition:opacity .22s;overflow-wrap:anywhere;white-space:pre-line;
  pointer-events:none;z-index:5}
#answer.on{opacity:1}
#answer.on{animation:answerRise .26s cubic-bezier(.2,.8,.2,1) both}
@keyframes answerRise{from{transform:translate(-50%,10px);opacity:0}to{transform:translate(-50%,0);opacity:1}}

/* 结局 / 继任 */
#veil{position:absolute;inset:0;background:#e8e4dc;display:none;
  flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:34px;z-index:20}
#veil.on{display:flex}
#veil .kicker{font-size:11px;letter-spacing:0;color:#6b6459;margin-bottom:18px}
#veil h1{font-size:30px;margin:0 0 22px;letter-spacing:0;font-weight:normal}
#veil .body{font-size:14px;line-height:2;color:#3a3630;max-width:290px;margin-bottom:14px}
#veil .carry{font-size:12px;line-height:2;color:#6b6459;border-top:1px solid #d5cfc2;
  padding-top:16px;margin-top:6px;max-width:290px;text-align:left;width:100%}
#veil button{margin-top:26px;background:none;border:1.5px solid #1a1a1a;
  color:#1a1a1a;font-family:inherit;font-size:14px;letter-spacing:0;
  padding:11px 30px;cursor:pointer}
#veil button:active{background:#1a1a1a;color:#faf7f0}
#dbg{display:none}


@media (max-height:620px){
  #app{padding-top:12px;padding-bottom:10px}
  #bars{gap:12px;margin-bottom:8px;padding-top:0}
  .bar{grid-template-rows:14px 24px 13px 4px;row-gap:4px}
  .bar .impact{height:14px}
  .bar .icon,.bar .icon svg{width:22px;height:22px}
  .bar .lbl{font-size:10px;line-height:13px}
  .bar .track{height:4px}
  #meta{font-size:11px;margin-bottom:6px}
  .card{padding:17px 16px 14px}
  .card .q{font-size:17px;line-height:1.65;padding:16px 2px}
  .card .hint{padding-top:7px}
  .opt-label{top:14px;max-width:calc(100% - 28px);padding:8px 10px;font-size:12px;min-height:34px}
  #answer{width:92%;padding:6px 4px 0;font-size:12px;line-height:1.5}
  .deck-card.back-far{transform:translate3d(0,-14px,0) scale(.93) rotate(-2.4deg)}
  .deck-card.back-mid{transform:translate3d(0,-9px,0) scale(.965) rotate(1.5deg)}
  .deck-card.back-near{transform:translate3d(0,-5px,0) scale(.985) rotate(-.8deg)}
}

/* 触摸屏上把选择徽标做得更醒目，但仍留在当前卡片的面内。 */
@media (pointer:coarse), (max-width:600px){
  .opt-label{top:16px;min-height:44px;max-width:calc(100% - 28px);
    padding:10px 14px;font-size:15px;line-height:1.35;color:#fff;

  .opt-yes{left:14px;border-left-width:3px}
  .opt-no{right:14px;border-right-width:3px}
}

@media (max-width:340px){
  #app{padding-left:12px;padding-right:12px}
  #bars{gap:10px;padding-left:2px;padding-right:2px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
    transition-duration:.01ms!important}
}
</style>

<script>
'use strict';

const Founder = (() => {
  const VERSION = 7;
  const HISTORY_LIMIT = 80;
  const RESOURCES = ['money', 'team', 'market', 'mind'];
  const MAKERS = ['韩涛', '顾言', '邱白', '林工', '郑然', '叶舟'];
  const COMPANIES = ['野火', '逆流', '锋芒', '破晓', '无限', '再起'];
  const LABELS = ['经营期', '风口', '退潮', '逆风'];
  const DANGER = {
    money: {low:18, flag:'risk_money_run', ending:'closed'},
    team: {low:20, flag:'risk_team_run', ending:'alone'},
    market: {low:15, high:85, flag:'risk_market_low_run', highFlag:'risk_market_high_run', ending:'forgotten', highEnding:'overload'},
    mind: {low:18, high:85, flag:'risk_mind_low_run', highFlag:'risk_mind_high_run', ending:'hollow', highEnding:'allin'},
  };

  function random(state){
    state.rng = (state.rng + 0x6D2B79F5) >>> 0;
    let value = state.rng;
    value = Math.imul(value ^ (value >>> 15), value | 1);
    value ^= value + Math.imul(value ^ (value >>> 7), value | 61);
    return ((value ^ (value >>> 14)) >>> 0) / 4294967296;
  }

  function create(seed, dynasty = 1, keep = {}, archive = [], recent = [], rival = ''){
    const state = {
      version:VERSION, seed:seed >>> 0, rng:seed >>> 0, dynasty, turn:1,
      money:68, team:62, market:48, mind:58,
      flags:{...keep}, marked:{}, lock:{}, history:[],
      archive:archive.slice(-8), recent:recent.slice(-54), rival,
      company:COMPANIES[(dynasty - 1) % COMPANIES.length],
      maker:MAKERS[(dynasty - 1) % MAKERS.length],
      status:'ready', current:null, feedback:null, ending:null,
    };
    if (state.maker === rival) state.maker = MAKERS[dynasty % MAKERS.length];
    state.windStart = 5 + Math.floor(random(state) * 3);
    state.windEnd = state.windStart + 4 + Math.floor(random(state) * 2);
    state.flags.lucky_bet_run = random(state) < 0.48 ? 1 : 0;
    return state;
  }

  function phase(state){
    const cycleTurn = (state.turn - 1) % 24 + 1;
    if (cycleTurn < state.windStart) return 1;
    if (cycleTurn < state.windEnd) return 2;
    if (cycleTurn < state.windEnd + 3) return 3;
    return 4;
  }

  function value(state, name){
    if (RESOURCES.includes(name) || name === 'turn' || name === 'dynasty') return state[name];
    if (name === 'phase') return phase(state);
    if (name.startsWith('age_')){
      const marked = state.marked[`${name.slice(4)}_run`];
      return marked === undefined ? -1 : state.turn - marked;
    }
    return state.flags[name] || 0;
  }

  function condition(state, expression){
    if (!expression) return true;
    return expression.split(/\s+and\s+/).every(token => {
      const term = token.trim();
      const match = term.match(/^([A-Za-z_]\w*)\s*(>=|<=|>|<|=)\s*(-?\d+)$/);
      if (match){
        const actual = value(state, match[1]);
        const expected = Number(match[3]);
        switch (match[2]){
          case '>': return actual > expected;
          case '<': return actual < expected;
          case '>=': return actual >= expected;
          case '<=': return actual <= expected;
          default: return actual === expected;
        }
      }
      if (!/^!?[A-Za-z_]\w*$/.test(term)) throw new Error(`Unknown condition: ${term}`);
      return term.startsWith('!') ? !value(state, term.slice(1)) : Boolean(value(state, term));
    });
  }

  function render(state, text){
    const replacements = {company:state.company, maker:state.maker, rival:state.rival || '韩涛'};
    return String(text || '').replace(/\{(\w+)\}/g, (match, key) => replacements[key] || match);
  }

  function pick(state, cards, metadata){
    if (state.status === 'card') return cards.find(card => card.card === state.current);
    if (state.status !== 'ready') return null;
    const available = card => !state.lock[card.card] || (typeof state.lock[card.card] === 'number' && state.turn >= state.lock[card.card]);
    let pool = cards.filter(card => available(card) && condition(state, card.conditions));
    if (!pool.length) throw new Error(`No eligible card at turn ${state.turn}`);
    const highest = Math.max(...pool.map(card => Number(card.weight)));
    pool = pool.filter(card => highest >= 1000 ? Number(card.weight) === highest : Number(card.weight) >= highest * 0.5);
    const last = state.history.at(-1);
    const weighted = pool.map(card => {
      let weight = Number(card.weight);
      if (state.recent.includes(card.card)) weight *= 0.35;
      if (state.history.slice(-6).some(entry => entry.card === card.card)) weight *= 0.2;
      if (highest < 1000 && last && metadata[card.card]?.kind === metadata[last.card]?.kind) weight *= 0.6;
      return {card, weight};
    });
    let ticket = random(state) * weighted.reduce((sum, item) => sum + item.weight, 0);
    const selected = weighted.find(item => (ticket -= item.weight) <= 0)?.card || weighted.at(-1).card;
    state.current = selected.card;
    state.status = 'card';
    return selected;
  }

  function effect(state, card, side){
    const currentPhase = phase(state);
    const operating = state.turn > 3 && !['pressure', 'exit', 'breather', 'legacy'].includes(card.thematic);
    const upkeep = operating ? {money:currentPhase === 4 ? -4 : currentPhase === 2 ? -2 : -3, team:-1, market:currentPhase === 4 ? -2 : -1, mind:0} : {};
    const changes = {};
    for (const resource of RESOURCES){
      const raw = Number(card[`${side}_${resource}`]) || 0;
      let multiplier = 1;
      if (!['pressure', 'exit', 'legacy'].includes(card.thematic)){
        if (currentPhase === 2 && resource === 'money') multiplier = raw > 0 ? 1.4 : 0.8;
        if (currentPhase === 2 && resource === 'market' && raw > 0) multiplier = 1.15;
        if (currentPhase === 4 && resource === 'money') multiplier = raw > 0 ? 0.85 : 1.15;
      }
      changes[resource] = Math.sign(raw) * Math.round(Math.abs(raw) * multiplier) + (upkeep[resource] || 0);
    }
    return changes;
  }

  function projected(state, card, side){
    const changes = effect(state, card, side);
    return Object.fromEntries(RESOURCES.map(resource => {
      const danger = DANGER[resource];
      let next = Math.max(0, Math.min(100, state[resource] + changes[resource]));
      if (next === 0 && !state.flags[danger.flag]) next = 1;
      if (danger.high && next === 100 && !state.flags[danger.highFlag]) next = 99;
      return [resource, next];
    }));
  }

  function resourceEnding(state){
    for (const resource of RESOURCES){
      if (state[resource] <= 0) return DANGER[resource].ending;
      if (DANGER[resource].high && state[resource] >= 100) return DANGER[resource].highEnding;
    }
    return null;
  }

  function applyFlags(state, expression){
    let ending = null;
    for (const token of (expression || '').split(/\s+and\s+/)){
      if (!token) continue;
      if (token.startsWith('end_')) ending = token.slice(4);
      else if (token.startsWith('!')) delete state.flags[token.slice(1)];
      else {
        const name = token.replace(/\++$/, '');
        if (!Object.hasOwn(state.marked, name)) state.marked[name] = state.turn;
        state.flags[name] = token.endsWith('+') ? (state.flags[name] || 0) + 1 : 1;
      }
    }
    return ending;
  }

  function choose(state, card, side, metadata){
    if (state.status !== 'card' || state.current !== card.card || !['no', 'yes'].includes(side)) return false;
    const before = Object.fromEntries(RESOURCES.map(resource => [resource, state[resource]]));
    const after = projected(state, card, side);
    Object.assign(state, after);
    const scriptedEnding = applyFlags(state, card[`${side}_custom`]);
    if (state.flags.partner_left_run) state.rival = state.maker;
    const entry = {
      turn:state.turn, phase:phase(state), card:card.card, side,
      bearer:render(state, card.bearer), question:render(state, card.question),
      option:render(state, card[`override_${side}`]), reply:render(state, card[`answer_${side}`]), before, after,
    };
    state.history.push(entry);
    state.history = state.history.slice(-HISTORY_LIMIT);
    state.lock[card.card] = card.lockturn === 'del' ? true : state.turn + Number(card.lockturn);
    state.feedback = {...entry, ending:resourceEnding(state) || scriptedEnding};
    state.status = 'feedback';
    return true;
  }

  function advance(state){
    if (state.status !== 'feedback') return false;
    if (state.feedback.ending){
      state.ending = state.feedback.ending;
      state.status = 'ended';
    } else {
      state.turn++;
      state.current = null;
      state.status = 'ready';
    }
    return true;
  }

  function nextCompany(state, endings){
    if (state.status !== 'ended') throw new Error('The current company has not ended');
    const keep = Object.fromEntries(Object.entries(state.flags).filter(([name, amount]) => name.endsWith('_keep') && !name.startsWith('last_') && amount));
    if (endings[state.ending]?.flag) keep[endings[state.ending].flag] = 1;
    const archive = [...state.archive, {company:state.company, maker:state.maker, dynasty:state.dynasty, ending:state.ending, turns:state.turn}];
    return create(Math.floor(random(state) * 4294967296), state.dynasty + 1, keep, archive,
      [...state.recent, ...state.history.map(entry => entry.card)], state.rival);
  }

  function restore(serialized, cards, endings){
    try {
      const state = JSON.parse(serialized);
      const names = new Set(cards.map(card => card.card));
      const plain = object => object !== null && typeof object === 'object' && !Array.isArray(object);
      const integer = (amount, minimum = 0, maximum = Number.MAX_SAFE_INTEGER) => Number.isSafeInteger(amount) && amount >= minimum && amount <= maximum;
      const resources = object => plain(object) && RESOURCES.every(resource => integer(object[resource], 0, 100));
      const entry = item => plain(item) && names.has(item.card) && integer(item.turn, 1) && integer(item.phase, 1, 4)
        && ['no', 'yes'].includes(item.side) && ['bearer', 'question', 'option', 'reply'].every(field => typeof item[field] === 'string')
        && resources(item.before) && resources(item.after);
      if (!plain(state) || state.version !== VERSION || !resources(state)) return null;
      if (!integer(state.turn, 1) || !integer(state.dynasty, 1) || !integer(state.seed, 0, 4294967295) || !integer(state.rng, 0, 4294967295)) return null;
      if (![5, 6, 7].includes(state.windStart) || ![4, 5].includes(state.windEnd - state.windStart)) return null;
      if (!MAKERS.includes(state.maker) || !COMPANIES.includes(state.company) || (state.rival !== '' && !MAKERS.includes(state.rival))) return null;
      if (['flags', 'marked', 'lock'].some(key => !plain(state[key]))) return null;
      if (Object.entries(state.flags).some(([name, amount]) => !/^[A-Za-z_]\w*_(run|keep)$/.test(name) || !integer(amount))) return null;
      if (Object.values(state.marked).some(turn => !integer(turn, 1, state.turn))) return null;
      if (Object.entries(state.lock).some(([name, locked]) => !names.has(name) || (locked !== true && !integer(locked, 1)))) return null;
      if (['history', 'archive', 'recent'].some(key => !Array.isArray(state[key]))) return null;
      if (!['ready', 'card', 'feedback', 'ended'].includes(state.status)) return null;
      const decided = state.status === 'feedback' || state.status === 'ended';
      const completed = state.turn - (decided ? 0 : 1);
      if (state.history.length !== Math.min(HISTORY_LIMIT, completed) || state.archive.length > 8 || state.recent.length > 54) return null;
      if (state.history.some((item, index) => !entry(item) || item.turn !== completed - state.history.length + index + 1)) return null;
      if (state.status === 'ready' ? state.current !== null : !names.has(state.current)) return null;
      if (state.status === 'card'){
        const locked = state.lock[state.current];
        if (locked === true || (typeof locked === 'number' && state.turn < locked)) return null;
        if (!condition(state, cards.find(card => card.card === state.current).conditions)) return null;
      }
      if (state.status === 'ended' ? !Object.hasOwn(endings, state.ending) : state.ending !== null) return null;
      const last = state.history.at(-1);
      if (last){
        if (!entry(state.feedback) || ![null, ...Object.keys(endings)].includes(state.feedback.ending)) return null;
        if (Object.keys(last).some(key => JSON.stringify(state.feedback[key]) !== JSON.stringify(last[key]))) return null;
        if (RESOURCES.some(resource => state[resource] !== last.after[resource])) return null;
        if (decided && state.current !== state.feedback.card) return null;
        if (state.status === 'ended' && state.ending !== state.feedback.ending) return null;
        if (!decided && state.feedback.ending) return null;
      } else if (state.feedback !== null) return null;
      if (state.history.some(item => !state.lock[item.card]) || state.recent.some(name => !names.has(name))) return null;
      if (state.archive.some(item => !plain(item) || !COMPANIES.includes(item.company) || !MAKERS.includes(item.maker)
        || !integer(item.dynasty, 1, state.dynasty - 1) || !integer(item.turns, 1) || !Object.hasOwn(endings, item.ending))) return null;
      return state;
    } catch { return null; }
  }

  return {VERSION, HISTORY_LIMIT, RESOURCES, LABELS, DANGER, create, random, phase, value,
    condition, render, pick, effect, projected, resourceEnding, choose, advance, nextCompany, restore};
})();

if (typeof module !== 'undefined' && module.exports) module.exports = Founder;

</script>

    stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.2L21 8H3z"/>
    <path d="M5.6 8v9M10.5 8v9M13.5 8v9M18.4 8v9"/>
    <path d="M3 20.4h18"/>
  </svg>`,
};

const RES = [
  {k:'money',  n:'钱', icon:SVG.cash},
  {k:'team',   n:'人', icon:SVG.team},
  {k:'market', n:'客', icon:SVG.market},
  {k:'mind',   n:'心', icon:SVG.capital},
];


const $ = selector => document.querySelector(selector);
const stage = $('#stage'), veil = $('#veil'), ansEl = $('#answer');
const STORAGE_KEY = 'founder-astra-v7-save';
let state, cur = null, busy = false;
let restoreCardFocus = false;
let animationEpoch = 0;
const escape = text => String(text ?? '').replace(/[&<>"']/g, character => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[character]));

function seed(){
  const values = new Uint32Array(1);
  return globalThis.crypto?.getRandomValues ? crypto.getRandomValues(values)[0] : Date.now() >>> 0;
}

function save(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
}

function drawBars(previousValues){
  const box = $('#bars');
  if (!box.children.length){
    box.innerHTML = RES.map(r=>
      `<div class="bar" data-k="${r.k}" aria-label="${r.n}">
         <div class="impact"><span class="dot"></span></div>
         <div class="icon">${r.icon}</div>
         <div class="lbl">${r.n}</div>
         <div class="track" role="progressbar" aria-label="${r.n}" aria-valuemin="0" aria-valuemax="100"><div class="fill"></div></div>
       </div>`).join('');
  }
  RES.forEach(r=>{
    const el = box.querySelector(`[data-k="${r.k}"]`);
    const v = Math.max(0, Math.min(100, state[r.k]));
    const fill = el.querySelector('.fill');
    const track = el.querySelector('.track');
    const before = previousValues && Number.isFinite(previousValues[r.k])
      ? Math.max(0, Math.min(100, previousValues[r.k])) : null;
    const changed = before !== null && before !== v;
    if (changed){
      const direction = v < before ? 'impact-down' : 'impact-up';
      el.classList.remove('impact-down','impact-up','flash');
      void el.offsetWidth;
      el.classList.add(direction,'flash');
      // 先停在旧位置，再在下一帧明显退进，避免瞬间跳变。
      fill.style.transition = 'none';
      fill.style.width = before + '%';
      void fill.offsetWidth;
      fill.style.transition = '';
      requestAnimationFrame(()=>{
        if (fill.isConnected) fill.style.width = v + '%';
      });
      window.setTimeout(()=>{
        if (el.isConnected) el.classList.remove('impact-down','impact-up','flash');
      }, 980);
    } else {
      fill.style.width = v + '%';
      if (!previousValues) el.classList.remove('impact-down','impact-up','flash');
    }
    track.setAttribute('aria-valuenow', v);
    const danger = Founder.DANGER[r.k];
    el.classList.toggle('warn', v <= danger.low || Boolean(danger.high && v >= danger.high));
  });
  $('#mLeft').textContent = `第 ${state.dynasty} 次创业 · ${Founder.LABELS[Founder.phase(state) - 1]}`;
  $('#mRight').textContent = `在任 ${tenure()}`;
}

function tenure(){
  const totalMonths = state.turn * 2;
  const years = Math.floor(totalMonths / 12);
  const months = totalMonths % 12;
  return years ? `${years}年${months ? months + '个月' : ''}` : `${totalMonths}个月`;
}

const DECK_LAYERS = [
  {className:'back-far', y:-18, compactY:-14, scale:.93, angle:-2.4, settle:6},
  {className:'back-mid', y:-12, compactY:-9,  scale:.965, angle:1.5, settle:7},
  {className:'back-near',y:-6,  compactY:-5,  scale:.985, angle:-.8, settle:6},
];

function ensureDeck(){
  let deck = stage.querySelector('.deck');
  if (deck) return deck;
  deck = document.createElement('div');
  deck.className = 'deck';
  deck.setAttribute('aria-hidden','true');
  deck.innerHTML = DECK_LAYERS.map(layer =>
    `<div class="deck-card ${layer.className}"></div>`
  ).join('');
  stage.prepend(deck);
  setDeckProgress(0);
  return deck;
}

function setDeckProgress(progress){
  const deck = stage.querySelector('.deck');
  if (!deck) return;
  const p = Math.max(0, Math.min(1, progress));
  const compact = window.innerHeight <= 620;
  DECK_LAYERS.forEach(layer=>{
    const el = deck.querySelector('.' + layer.className);
    if (!el) return;
    const startY = compact ? layer.compactY : layer.y;
    const y = startY + p * Math.min(Math.abs(startY), layer.settle);
    const scale = layer.scale + p * (1 - layer.scale) * .45;
    const angle = layer.angle * (1 - p * .18);
    el.style.transform = `translate3d(0,${y}px,0) scale(${scale}) rotate(${angle}deg)`;
  });
}

function positionAnswer(){
  const activeCard = stage.querySelector('.card');
  if (!activeCard) return;
  const compact = window.innerHeight <= 620;
  const gap = compact ? 18 : 24;
  const cardTop = activeCard.offsetTop;
  const cardBottom = cardTop + activeCard.offsetHeight;
  const answerHeight = ansEl.offsetHeight;
  const below = cardBottom + gap;
  const above = cardTop - gap - answerHeight;
  const top = below + answerHeight <= stage.clientHeight ? below : Math.max(0,above);
  ansEl.style.top = `${top}px`;
}

function show(card = Founder.pick(state, STORY.cards, STORY.meta.cards), locked = false){
  if (!card) throw new Error('没有可以展示的故事卡。');
  cur = {...card, yes: Founder.effect(state, card, 'yes'), no: Founder.effect(state, card, 'no')};
  for (const field of ['bearer', 'question', 'override_no', 'override_yes']) cur[field] = Founder.render(state, card[field]);
  ansEl.classList.remove('on');
  ansEl.textContent = '';
  ensureDeck();
  const element = document.createElement('div');
  element.className = 'card deal-in';
  element.innerHTML = `<div class="opt-label opt-no" aria-hidden="true"></div>
    <div class="opt-label opt-yes" aria-hidden="true"></div>
    <div class="who">${escape(cur.bearer)}</div>
    <div class="q">${escape(cur.question).replace(/\n/g, '<br>')}</div>
    <div class="hint">← 左划 · 右划 →</div>`;
  const clearDealIn = () => element.classList.remove('deal-in');
  element.addEventListener('animationend', clearDealIn, {once:true});
  stage.querySelectorAll('.card').forEach(previous => previous.remove());
  stage.appendChild(element);
  stage.classList.remove('is-committing','is-dragging');
  setDeckProgress(0);
  setTimeout(clearDealIn, 520);
  element.querySelector('.opt-no').textContent = cur.override_no;
  element.querySelector('.opt-yes').textContent = cur.override_yes;
  element.tabIndex = 0;
  element.setAttribute('role', 'group');
  element.setAttribute('aria-keyshortcuts', 'ArrowLeft ArrowRight');
  element.setAttribute('aria-label', `${cur.bearer}：${cur.question}。左选项：${cur.override_no}；右选项：${cur.override_yes}`);
  bindDrag(element);
  busy = locked;
  if (locked){
    element.classList.remove('deal-in');
    element.classList.add('waiting');
    element.setAttribute('aria-disabled', 'true');
    element.style.opacity = '0';
    element.style.transform = `translateX(${window.innerWidth + element.offsetWidth}px)`;
  } else if (restoreCardFocus) {
    element.focus();
  }
  drawBars();
  save();
}

function hideImpactDots(){
  RES.forEach(r=>{
    const dot = $('#bars').querySelector(`[data-k="${r.k}"] .dot`);
    if (dot) dot.classList.remove('show');
  });
}

function showImpactDots(choice){
  RES.forEach(r=>{
    const dot = $('#bars').querySelector(`[data-k="${r.k}"] .dot`);
    if (!dot) return;
    const delta = Math.abs(choice[r.k] || 0);
    if (!delta){
      dot.classList.remove('show');
      return;
    }
    const size = delta >= 20 ? 12 : delta >= 15 ? 10 : delta >= 10 ? 8 : 6;
    dot.style.width = size + 'px';
    dot.style.height = size + 'px';
    dot.classList.add('show');
  });
}

function bindDrag(el){
  let sx=0, dx=0, drag=false, pointerId=null, pointerType='', inputSource='';
  const choiceNo = el.querySelector('.opt-no');
  const choiceYes = el.querySelector('.opt-yes');
  const who = el.querySelector('.who');
  const question = el.querySelector('.q');
  const hint = el.querySelector('.hint');

  const isTouchEvent = e => e.type.indexOf('touch') === 0;
  const pointFrom = e => {
    const point = isTouchEvent(e)
      ? ((e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]))
      : e;
    return point && Number.isFinite(point.clientX) ? point : null;
  };
  const clientX = e => {
    const point = pointFrom(e);
    return point ? point.clientX : null;
  };

  const reset = ()=>{
    el.style.transform='';
    choiceNo.style.opacity = choiceYes.style.opacity = '0';
    choiceNo.classList.remove('revealed');
    choiceYes.classList.remove('revealed');
    who.style.opacity = question.style.opacity = hint.style.opacity = '1';
    stage.classList.remove('is-dragging','is-committing');
    el.classList.remove('touch-dragging');
    setDeckProgress(0);
    hideImpactDots();
  };

  const down = e => {
    const touch = isTouchEvent(e) || e.pointerType === 'touch' || e.pointerType === 'pen';
    // Touch pointer events commonly use button=-1; only reject non-primary mice.
    if (busy || drag || (!touch && e.button !== 0)) return;
    const x = clientX(e);
    if (x === null) return;
    restoreCardFocus = false;
    // 区分事件来源（pointer/touch）与指针类型（mouse/touch/pen）。
    // 有些浏览器会同时派发两套事件，来源锁定可避免重复提交。
    drag=true; inputSource=isTouchEvent(e) ? 'touch' : 'pointer';
    pointerId=e.pointerId == null ? null : e.pointerId;
    pointerType=touch ? 'touch' : (e.pointerType || 'mouse');
    sx=x; dx=0;
    el.classList.remove('anim','deal-in');
    el.classList.add('dragging');
    if (touch) el.classList.add('touch-dragging');
    stage.classList.add('is-dragging');
    if (e.pointerId != null && el.setPointerCapture){
      try { el.setPointerCapture(e.pointerId); } catch (_) { /* older WebKit */ }
    }
    if (touch && e.cancelable) e.preventDefault();
  };
  const move = e => {
    if(!drag) return;
    const eventSource = isTouchEvent(e) ? 'touch' : 'pointer';
    // 触摸指针在部分 WebView 中会交替派发 pointermove/touchmove，两者都可用。
    if (pointerType !== 'touch' && eventSource !== inputSource) return;
    if (!isTouchEvent(e) && pointerId !== null && e.pointerId !== pointerId) return;
    const x = clientX(e);
    if (x === null) return;
    dx=x - sx;
    if (isTouchEvent(e) && e.cancelable) e.preventDefault();
    const visualDx = Math.max(-112, Math.min(112, dx));
    el.style.transform=`translateX(${visualDx}px) rotate(${visualDx/26}deg)`;
    setDeckProgress(Math.min(1, Math.abs(dx) / 120));
    // 中立区先保留回弹空间；只有明显偏向一侧时才让选项变得醒目。
    const absD = Math.abs(dx);
    const revealStart = pointerType === 'touch' ? 24 : 30;
    const revealFull = pointerType === 'touch' ? 86 : 96;
    const optOpacity = absD>revealStart
      ? Math.min(1,(absD-revealStart)/(revealFull-revealStart))
      : 0;
    const visibleOpacity = pointerType === 'touch' && absD > 48
      ? Math.max(.88,optOpacity) : optOpacity;
    // 卡片内容渐隐，但不影响上方的选择徽标。
    const contentStart = pointerType === 'touch' ? 24 : 30;
    const contentFull = pointerType === 'touch' ? 76 : 80;
    const contentOpacity = absD>contentStart
      ? Math.max(0, 1-(absD-contentStart)/(contentFull-contentStart))
      : 1;

    choiceYes.style.opacity = dx>revealStart ? visibleOpacity : 0;
    choiceNo.style.opacity = dx<-revealStart ? visibleOpacity : 0;
    choiceYes.classList.toggle('revealed',dx>revealStart);
    choiceNo.classList.toggle('revealed',dx<-revealStart);
    who.style.opacity = question.style.opacity = hint.style.opacity = contentOpacity;

    // 显示影响圆点
    if (absD > revealStart) {
      showImpactDots(dx > 0 ? cur.yes : cur.no);
    } else {
      hideImpactDots();
    }
  };
  const commit = yes=>{
    const fly = window.innerWidth + el.offsetWidth;
    const direction = yes ? 1 : -1;
    el.style.transform=`translate3d(${direction*fly}px,-${Math.min(76,Math.max(34,Math.abs(dx)*.22))}px,0) rotate(${direction*22}deg) scale(.96)`;
    el.style.opacity='0';
    choiceNo.style.opacity = choiceYes.style.opacity = '0';
    choiceNo.classList.remove('revealed');
    choiceYes.classList.remove('revealed');
    stage.classList.remove('is-dragging');
    el.classList.remove('touch-dragging');
    stage.classList.add('is-committing');
    setDeckProgress(1);
    hideImpactDots();
    choose(yes);
  };

  const finish = (e, cancelled=false) => {
    if(!drag) return;
    drag=false;
    inputSource='';
    el.classList.remove('dragging');
    el.classList.add('anim');
    stage.classList.remove('is-dragging');
    // 提交阈值约为卡片宽度的一半。阈值以内始终回到中立位。
    const commitThreshold = Math.max(136, Math.min(164, el.offsetWidth * .48));
    if (!cancelled && Math.abs(dx) >= commitThreshold){
      commit(dx>0);
    } else {
      reset();
    }
    dx=0;
  };
  el.addEventListener('pointerdown',down);
  el.addEventListener('pointermove',move);
  el.addEventListener('pointerup',e=>finish(e,false));
  el.addEventListener('pointercancel',e=>finish(e,true));
  // Older iOS/WebView builds may expose touch events without reliable PointerEvents.
  el.addEventListener('touchstart',down,{passive:false});
  el.addEventListener('touchmove',move,{passive:false});
  el.addEventListener('touchend',e=>finish(e,false),{passive:false});
  el.addEventListener('touchcancel',e=>finish(e,true),{passive:false});
  el.addEventListener('keydown',e=>{
    if (busy || (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight')) return;
    e.preventDefault();
    restoreCardFocus = true;
    el.classList.add('anim');
    commit(e.key === 'ArrowRight');
  });
}

function choose(yes){
  if (busy || state.status !== 'card') return;
  busy = true;
  if (!Founder.choose(state, cur, yes ? 'yes' : 'no', STORY.meta.cards)){
    busy = false;
    return;
  }
  save();
  showFeedback(true);
}

function showFeedback(animate = false){
  busy = true;
  hideImpactDots();
  drawBars(animate ? state.feedback.before : null);
  ansEl.textContent = state.feedback.reply;
  positionAnswer();
  ansEl.classList.add('on');
  const epoch = ++animationEpoch;
  setTimeout(() => {
    if (epoch !== animationEpoch || state.status !== 'feedback') return;
    ansEl.classList.remove('on');
    Founder.advance(state);
    save();
    if (state.status === 'ended') showEnding();
    else show();
  }, 1280);
}

function showEnding(){
  const ending = STORY.meta.endings[state.ending];
  busy = true;
  hideImpactDots();
  veil.innerHTML = `<div class="kicker">${escape(ending.label)}</div>
    <h1>${escape(ending.title)}</h1>
    <div class="body">${escape(Founder.render(state, ending.body)).replace(/\n/g, '<br>')}</div>
    <div class="carry">${escape(state.company)} · 本局在任 ${tenure()}<br>共做出 ${state.turn} 次决定。</div>
    <button id="go">再开一家</button>`;
  veil.classList.add('on');
  $('#go').onclick = () => {
    animationEpoch++;
    state = Founder.nextCompany(state, STORY.meta.endings);
    cur = null;
    veil.classList.remove('on');
    show();
  };
  if (restoreCardFocus) $('#go').focus();
  save();
}

window.addEventListener('resize', positionAnswer);

(function boot(){
  try {
    if (!STORY.cards?.length || !STORY.meta?.endings) throw new Error('请先运行 build.py，再打开生成的「玩.html」。');
    let stored = null;
    try { stored = localStorage.getItem(STORAGE_KEY); } catch {}
    state = stored ? Founder.restore(stored, STORY.cards, STORY.meta.endings) : null;
    const resumed = Boolean(state);
    const invalid = Boolean(stored && !state);
    state ||= Founder.create(seed());
    busy = true;
    drawBars();
    veil.innerHTML = `<div class="kicker">${escape(STORY.meta.credit)} 作品</div>
      <h1>创始人</h1>
      <div class="body">你是「${escape(state.company)}」的创始人。<br>
        公司正当红。<br>发布会开始了。</div>
      <div class="carry">左右划卡，做决定。${invalid ? '<br>存档未能完整读取，将重新开始。' : ''}</div>
      <button id="go">${resumed ? '继续' : '开始'}</button>`;
    veil.classList.add('on');
    $('#go').onclick = () => {
      veil.classList.remove('on');
      restoreCardFocus = true;
      if (state.status === 'ended') showEnding();
      else if (state.status === 'feedback'){
        show(STORY.cards.find(card => card.card === state.current), true);
        showFeedback();
      } else show();
    };
    $('#go').focus();
  } catch (error){
    busy = true;
    veil.innerHTML = `<h1>无法开始</h1><div class="body">${escape(error.message)}</div>`;
    veil.classList.add('on');
  }
})();

</script>
</body>
</html>
